[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-dynamics"
dynamic = ["version"]
description = "Bayesian system-dynamics pipeline for market regime classification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jeff Milam" },
]
keywords = [
    "finance",
    "regime-detection",
    "bayesian",
    "markov-chains",
    "quantitative-trading",
    "system-dynamics",
    "risk-management",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
data = [
    "yfinance>=0.2.31",
]
dashboard = [
    "streamlit>=1.28",
    "plotly>=5.17",
    "yfinance>=0.2.31",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
]
all = [
    "financial-dynamics[data,dashboard,dev]",
]

[project.urls]
Homepage = "https://micap.ai"
Repository = "https://github.com/jmiaie/financial-dynamics-model"
Documentation = "https://github.com/jmiaie/financial-dynamics-model#readme"
Issues = "https://github.com/jmiaie/financial-dynamics-model/issues"
Demo = "https://financial-dynamics-model.streamlit.app"

[project.scripts]
fdm = "financial_dynamics.__main__:main"

[tool.hatch.version]
path = "src/financial_dynamics/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "src/financial_dynamics/",
    "config/default.yaml",
]
exclude = [
    "config/calibrated.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/financial_dynamics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "plotly.*",
    "scipy.*",
    "sklearn.*",
    "yfinance.*",
]
ignore_missing_imports = true
