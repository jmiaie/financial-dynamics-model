name: Publication Pack (D10-A)

# Verification gate for publication/historical-regime-study/ ONLY. This
# workflow validates the publication pack -- it never re-runs, retunes, or
# re-acquires anything from the underlying D9 empirical study. It exists
# because the repo's main ci.yml only triggers on PRs into `main`, and this
# pack's PR intentionally targets a non-main base branch (PR #13's own
# branch), so ci.yml never runs on it.

on:
  push:
    branches: [publication/historical-regime-study]
  pull_request:
    paths:
      - publication/historical-regime-study/**
      - .github/workflows/publication-pack.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (offline after this step)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install ruff
          # Pin matplotlib to the exact version the pack's figures were
          # authored and verified against, to maximize byte-identical
          # reproducibility of the committed PNGs across environments
          # (matplotlib bundles its own default font + freetype build, so
          # pinning the wheel version is the main lever available here).
          pip install "matplotlib==3.11.2"

      - name: Verify publication pack (hashes, tables, figures, citations, no-rerun)
        run: python publication/historical-regime-study/scripts/verify_pack.py

      - name: Lint publication pack scripts
        run: ruff check publication/historical-regime-study/scripts/

      - name: Typecheck publication pack scripts
        run: mypy publication/historical-regime-study/scripts/ --ignore-missing-imports
