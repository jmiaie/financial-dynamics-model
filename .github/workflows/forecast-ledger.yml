name: Forecast ledger

# Weekly entry of the prospective forecast ledger (research/forecast_ledger/PROTOCOL.md).
# Scheduled runs and manual runs write one entry, timestamp it with OpenTimestamps and commit
# it to main. Pull requests that touch the ledger code do a dry run: same computation, nothing
# stamped and nothing committed. Raw prices are never committed or uploaded.

on:
  schedule:
    - cron: "17 7 * * 6"   # Saturdays 07:17 UTC, after Friday's close
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/forecast-ledger.yml"
      - "research/forecast_ledger/**"
      - "research/vol_benchmark/vol_benchmark.py"

permissions:
  contents: read

concurrency:
  group: forecast-ledger
  cancel-in-progress: false

jobs:
  entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RAW_DIR: ${{ runner.temp }}/ledger_raw
      TMP_DATASET: ledger_run_tmp
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install from lock
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Fetch prices up to the latest close
        run: |
          end="$(date -u -d tomorrow +%Y-%m-%d)"
          python scripts/acquire_yf_fd_etfs_daily.py \
            --dataset-id "$TMP_DATASET" --start 2015-01-01 --end "$end" --raw-dir "$RAW_DIR"
          # The acquisition script also writes a manifest for this throwaway id. It is not a
          # frozen dataset and must not be committed.
          rm -f "data/manifests/$TMP_DATASET.json"

      - name: Dry run (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          python research/forecast_ledger/make_entry.py --raw-dir "$RAW_DIR" --trigger dry-run \
            --entries "$RUNNER_TEMP/dry/entries" --ledger "$RUNNER_TEMP/dry/ledger.jsonl"
          python research/forecast_ledger/verify_ledger.py \
            --entries "$RUNNER_TEMP/dry/entries" --ledger "$RUNNER_TEMP/dry/ledger.jsonl"
          python research/forecast_ledger/verify_ledger.py

      - name: Write the entry
        if: github.event_name != 'pull_request'
        run: |
          trigger=manual
          if [ "${{ github.event_name }}" = "schedule" ]; then trigger=schedule; fi
          python research/forecast_ledger/make_entry.py --raw-dir "$RAW_DIR" --trigger "$trigger"
          python research/forecast_ledger/verify_ledger.py

      - name: Timestamp with OpenTimestamps
        if: github.event_name != 'pull_request'
        run: |
          pip install opentimestamps-client==0.7.2
          cd research/forecast_ledger/entries
          for f in *.json; do
            if [ ! -f "$f.ots" ]; then ots stamp "$f"; fi
          done
          # Earlier proofs become complete once Bitcoin has confirmed them.
          for p in *.ots; do ots upgrade "$p" || true; done
          rm -f ./*.bak

      - name: Commit the entry
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/forecast_ledger/entries research/forecast_ledger/ledger.jsonl
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "ledger: entry for $(tail -n 1 research/forecast_ledger/ledger.jsonl | python -c 'import json,sys; print(json.load(sys.stdin)["as_of_date"])')"
            git push
          fi
