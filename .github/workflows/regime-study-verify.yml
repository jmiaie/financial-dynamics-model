name: Regime Study Verification

# Verifies the reproducibility bundle in publication/historical-regime-study/:
# artifact hashes, table/figure regeneration, and citation integrity. It never
# re-runs, retunes, or re-downloads anything from the underlying study.

on:
  push:
    branches: [publication/historical-regime-study]
  pull_request:
    paths:
      - publication/historical-regime-study/**
      - .github/workflows/regime-study-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (offline after this step)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install ruff
          # Pin matplotlib to the exact version the bundle's figures were
          # authored and verified against, to maximize byte-identical
          # reproducibility of the committed PNGs across environments
          # (matplotlib bundles its own default font + freetype build, so
          # pinning the wheel version is the main lever available here).
          pip install "matplotlib==3.11.2"

      - name: Verify reproducibility bundle (hashes, tables, figures, citations, no-rerun)
        run: python publication/historical-regime-study/scripts/verify_pack.py

      - name: Lint bundle scripts
        run: ruff check publication/historical-regime-study/scripts/

      - name: Typecheck bundle scripts
        run: mypy publication/historical-regime-study/scripts/ --ignore-missing-imports
