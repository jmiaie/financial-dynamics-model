version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # No pip entry: requirements-lock.txt targets Python 3.12 and pins matplotlib 3.11.2, which
  # Dependabot cannot resolve under this package's Python 3.10 floor. The lock is upgraded with the
  # uv command in its header and audited with pip-audit.
